<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <style>
      .bg-rect {
        fill: #f8fafc;
        rx: 16px;
      }
      @media (prefers-color-scheme: dark) {
        .bg-rect { fill: #0f172a; }
        .grid-line { stroke: #1e293b !important; }
        .label-text { fill: #94a3b8 !important; }
        .face-contour { stroke: #1e293b !important; }
      }
      .grid-line {
        stroke: #e2e8f0;
        stroke-dasharray: 4 4;
        stroke-width: 1;
      }
      .label-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #64748b;
        letter-spacing: 0.05em;
        text-anchor: middle;
      }
      .face-contour {
        stroke: #cbd5e1;
        stroke-dasharray: 3 3;
        stroke-width: 1.5;
        fill: none;
      }

      /* Mouth opening animation */
      .mouth-cavity {
        transform-origin: 120px 75px;
        animation: mouthCycle 4s ease-in-out infinite;
      }

      .kanji-box {
        animation: kanjiPulse 4s ease-in-out infinite;
      }

      .uvula {
        animation: uvulaWiggle 4s ease-in-out infinite;
      }

      @keyframes mouthCycle {
        0%, 15% {
          transform: scale(0.6, 0.2);
          opacity: 0.4;
        }
        35%, 65% {
          transform: scale(1, 1);
          opacity: 1;
        }
        85%, 100% {
          transform: scale(0.6, 0.2);
          opacity: 0.4;
        }
      }

      @keyframes kanjiPulse {
        0%, 25% {
          stroke: #f43f5e;
          stroke-width: 6;
        }
        45%, 75% {
          stroke: #00a0f0;
          stroke-width: 8;
        }
        90%, 100% {
          stroke: #f43f5e;
          stroke-width: 6;
        }
      }

      @keyframes uvulaWiggle {
        0%, 30% { opacity: 0; transform: translateY(-5px); }
        40%, 65% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect class="bg-rect" width="240" height="160" />
  
  <!-- Subtle Crosshairs -->
  <line class="grid-line" x1="120" y1="20" x2="120" y2="130" />
  <line class="grid-line" x1="30" y1="75" x2="210" y2="75" />

  <!-- Soft Face Outline (Cheeks and Nose hint) -->
  <path class="face-contour" d="M 60 70 C 60 115, 180 115, 180 70" />
  <!-- Nose bridge -->
  <path class="face-contour" d="M 120 38 L 124 50 L 118 52" />

  <!-- Animated Mouth Cavity / Square Radical 口 -->
  <g class="mouth-cavity">
    <!-- Inner Mouth Dark Fill -->
    <rect x="90" y="50" width="60" height="52" rx="4" fill="#fda4af" opacity="0.3" />
    
    <!-- Uvula / Tekak -->
    <g class="uvula">
      <path d="M 116 50 Q 120 62 124 50" fill="#f43f5e" />
    </g>

    <!-- Radical/Kanji 口 Outer Square Stroke -->
    <rect class="kanji-box" x="90" y="50" width="60" height="52" rx="3" fill="none" stroke="#00a0f0" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Sound/Speech exclamation rays -->
  <line x1="72" y1="76" x2="80" y2="76" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="160" y1="76" x2="168" y2="76" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Caption Footnote -->
  <text class="label-text" x="120" y="142">MULUT MENGANGA KOTAK = 口</text>
</svg>
