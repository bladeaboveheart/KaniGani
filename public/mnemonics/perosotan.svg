<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <style>
      .bg-rect {
        fill: #f8fafc;
        rx: 16px;
      }
      @media (prefers-color-scheme: dark) {
        .bg-rect { fill: #0f172a; }
        .grid-line { stroke: #1e293b !important; }
        .label-text { fill: #94a3b8 !important; }
        .ladder { stroke: #334155 !important; }
      }
      .grid-line {
        stroke: #e2e8f0;
        stroke-dasharray: 4 4;
        stroke-width: 1;
      }
      .label-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #64748b;
        letter-spacing: 0.05em;
        text-anchor: middle;
      }
      .ladder {
        stroke: #cbd5e1;
        stroke-width: 3;
        stroke-linecap: round;
      }

      /* Slide animation */
      .slider-dot {
        animation: slideDown 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .slide-path {
        stroke-dasharray: 140;
        animation: drawSlide 3.2s ease-in-out infinite;
      }

      @keyframes slideDown {
        0%, 15% {
          transform: translate(145px, 35px) scale(1);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        60% {
          transform: translate(75px, 115px) scale(1.1);
          opacity: 1;
        }
        70%, 100% {
          transform: translate(60px, 118px) scale(0.9);
          opacity: 0;
        }
      }

      @keyframes drawSlide {
        0%, 10% {
          stroke: #00a0f0;
          stroke-width: 7;
        }
        50%, 80% {
          stroke: #0284c7;
          stroke-width: 9;
        }
        90%, 100% {
          stroke: #00a0f0;
          stroke-width: 7;
        }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect class="bg-rect" width="240" height="160" />
  
  <!-- Subtle Crosshairs -->
  <line class="grid-line" x1="120" y1="20" x2="120" y2="130" />
  <line class="grid-line" x1="30" y1="75" x2="210" y2="75" />

  <!-- Playground Ladder on right/top -->
  <line class="ladder" x1="150" y1="35" x2="150" y2="115" />
  <line class="ladder" x1="158" y1="35" x2="158" y2="115" />
  <line class="ladder" x1="150" y1="55" x2="158" y2="55" stroke-width="2" />
  <line class="ladder" x1="150" y1="75" x2="158" y2="75" stroke-width="2" />
  <line class="ladder" x1="150" y1="95" x2="158" y2="95" stroke-width="2" />

  <!-- Slide Curve: Radical 丿 -->
  <!-- Curves smoothly from top right (150, 35) to bottom left (72, 115) -->
  <path class="slide-path" d="M 148 35 C 145 65, 125 100, 72 115" fill="none" stroke="#00a0f0" stroke-width="8" stroke-linecap="round" />

  <!-- Animated Kid / Sliding Disc -->
  <g class="slider-dot">
    <circle cx="0" cy="0" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <path d="M -3 -1 Q 0 -4 3 -1" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <!-- Happy face smile -->
    <path d="M -3 2 Q 0 5 3 2" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Ground Line -->
  <line x1="55" y1="116" x2="168" y2="116" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />

  <!-- Dynamic Caption Footnote -->
  <text class="label-text" x="120" y="142">PEROSOTAN MELENGKUNG = 丿</text>
</svg>
