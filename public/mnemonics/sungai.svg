<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <style>
      .bg-rect {
        fill: #f8fafc;
        rx: 16px;
      }
      @media (prefers-color-scheme: dark) {
        .bg-rect { fill: #0f172a; }
        .grid-line { stroke: #1e293b !important; }
        .label-text { fill: #94a3b8 !important; }
        .water-wave { stroke: #38bdf8 !important; }
      }
      .grid-line {
        stroke: #e2e8f0;
        stroke-dasharray: 4 4;
        stroke-width: 1;
      }
      .label-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #64748b;
        letter-spacing: 0.05em;
        text-anchor: middle;
      }
      .water-wave {
        stroke: #bae6fd;
        stroke-dasharray: 8 6;
        animation: flowWater 2.5s linear infinite;
      }

      /* Kanji stream strokes */
      .kanji-river {
        stroke: #00a0f0;
        stroke-linecap: round;
        animation: riverDraw 4s ease-in-out infinite;
      }

      @keyframes flowWater {
        0% {
          stroke-dashoffset: 28;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes riverDraw {
        0%, 20% {
          stroke-width: 6;
          stroke: #0284c7;
        }
        40%, 80% {
          stroke-width: 8;
          stroke: #00a0f0;
        }
        90%, 100% {
          stroke-width: 6;
          stroke: #0284c7;
        }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect class="bg-rect" width="240" height="160" />
  
  <!-- Subtle Crosshairs -->
  <line class="grid-line" x1="120" y1="20" x2="120" y2="130" />
  <line class="grid-line" x1="30" y1="75" x2="210" y2="75" />

  <!-- Animated River Flow Curves (Pictograph streams behind) -->
  <path class="water-wave" d="M 75 32 C 72 65, 78 85, 70 118" fill="none" stroke-width="4" />
  <path class="water-wave" d="M 120 45 C 118 70, 122 85, 120 110" fill="none" stroke-width="4" />
  <path class="water-wave" d="M 165 30 C 168 60, 162 90, 165 120" fill="none" stroke-width="4" />

  <!-- Radical/Kanji 川 3 Strokes -->
  <g class="kanji-river">
    <!-- Left stroke: downward curve slightly to left -->
    <path d="M 75 35 C 75 70, 72 95, 66 115" fill="none" stroke-width="8" />

    <!-- Center stroke: straight vertical, slightly shorter -->
    <line x1="120" y1="46" x2="120" y2="108" stroke-width="8" />

    <!-- Right stroke: tall straight vertical -->
    <line x1="165" y1="35" x2="165" y2="118" stroke-width="8" />
  </g>

  <!-- Water droplets floating -->
  <circle cx="95" cy="50" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="145" cy="95" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="100" cy="105" r="2" fill="#38bdf8" opacity="0.6" />

  <!-- Dynamic Caption Footnote -->
  <text class="label-text" x="120" y="142">3 ALIRAN ARUS SUNGAI = 川</text>
</svg>
